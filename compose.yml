services:
  frontend:
    build:
      context: .
    restart: always
    ports:
      - "32781:80"

  cf-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token YOUR_CLOUDFLARE_TUNNEL_TOKEN
    restart: always
    depends_on:
      - frontend
    profiles:
      - cloudflare